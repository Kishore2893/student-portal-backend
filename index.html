<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- 🎓 బ్రౌజర్ క్యాప్ ఎమోజీ లోగో (URL Encoded ఫార్మాట్ - ఇది అన్ని బ్రౌజర్లలో పక్కాగా లోడ్ అవుతుంది) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%93%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- గూగుల్ సెర్చ్‌లో కనిపించే మెయిన్ టైటిల్ -->
    <title>JEE Main 2027 Score Calculator</title>

    <!-- మీ ప్రొఫెషనల్ డిస్క్రిప్షన్ -->

    <!-- సైట్ నేమ్ మరియు ఫుల్ URL కోడ్ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "JEE Score Calculator",
      "url": "https://iit-jee-studentservices.vercel.app/"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- ⚡ ఇది మీ ఒరిజినల్ Vite స్క్రిప్ట్ లైన్ -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
